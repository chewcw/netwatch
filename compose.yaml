services:
  netwatch:
    build: .
    image: netwatch:edge
    # Edge devices: pull the multi-platform image from a registry instead of
    # building (see README "Build the image") — e.g. image: your-registry/netwatch:edge
    restart: unless-stopped
    environment:
      NETWATCH_TARGETS: "sensor-collector"
      NETWATCH_CHECK_INTERVAL: "30s"
      NETWATCH_ALERT_AFTER: "90s"
      NETWATCH_MIN_TRAFFIC_RX: "0"
      NETWATCH_MIN_TRAFFIC_TX: "0"
      NETWATCH_DOCKER_HOST: "unix:///var/run/docker.sock"
      NETWATCH_NOTIFY: "log"
      NETWATCH_LOG_LEVEL: "info"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The image runs as the distroless nonroot user; it needs the host's
    # docker group GID as a supplementary group to read the socket.
    # Get it on the host with:  getent group docker
    group_add:
      - "994"
    read_only: true
    security_opt:
      - no-new-privileges:true

    # --- Email notification (optional) ------------------------------------
    # M365 email alerts need a one-time device-code login. Enable with:
    #   docker exec netwatch auth-login     (or: docker run --rm -it -v netwatch-data:/data -v /var/run/docker.sock:/var/run/docker.sock --group-add "$(getent group docker | cut -d: -f3)" netwatch:edge auth-login)
    #   docker exec netwatch test-email
    # The token file lives on the netwatch-data volume; the image's nonroot
    # user (uid 65532) must be able to write it.
    # volumes:
    #   - netwatch-data:/data
    # environment:
    #   NETWATCH_NOTIFY: "email"
    #   NETWATCH_EMAIL_TENANT_ID: "<your-tenant-id>"
    #   NETWATCH_EMAIL_CLIENT_ID: "<your-client-id>"
    #   NETWATCH_EMAIL_TO: "you@example.com,teammate@example.com"
    #   NETWATCH_EMAIL_TOKEN_FILE: "/data/netwatch-email-token.json"
    #   NETWATCH_EMAIL_HOST: "edge-pc-1"

# volumes:
#   netwatch-data:
